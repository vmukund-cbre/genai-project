# CBRE Real Estate Query Examples
# These examples help the LLM understand how to convert natural language to Cypher queries

query_examples:
  - input: "What building had the highest number of workorders for Christus Health in the US?"
    output: |
        MATCH(a:Activity) - [:MANAGES] - (l:Location)
        OPTIONAL MATCH(a) - [:TARGETS] - (asset:Asset)
        MATCH(l) - [:USES] - (customer:Organization)
        MATCH(l) - [:MAINTAINS] - (country:Organization)
        WHERE toLower(customer.key) = 'christus health'
        AND toLower(country.key) = 'us'
        WITH asset, count(a) as activityCount
        WHERE asset IS NOT NULL
        RETURN asset.id, asset.name, activityCount
        ORDER BY activityCount DESC
        LIMIT 1

  - input: "When was the last visit , state of service class(reactive/planned)"
    output: |
        MATCH (a:Activity)-[:RESPONDS]->(w:WorkOrder)-[:RESPONDS]->(r:Request)-[:ACTIVATES]->(sc:ServiceClassification)
        WHERE sc.inputStream IN ["Reactive", "Corrective", "Planned"]
        WITH a, sc
        ORDER BY coalesce(a.completionDate, a.startDate, a.createdDate) DESC
        RETURN a.id AS ActivityID, coalesce(a.completionDate, a.startDate, a.createdDate) AS LastVisitDate, sc.inputStream AS ServiceType
        LIMIT 1
      
  - input: "Look for Leaky Assets"
    output: |
        MATCH (a:Asset)<-[:CONTAINS]-(p:Position)<-[:TARGETS]-(r:Request)
        OPTIONAL MATCH (r)-[:ACTIVATES]->(sc:ServiceClassification)
        OPTIONAL MATCH (r)<-[:RESPONDS]-(wo:WorkOrder)
        WITH a, r, sc, wo
        WHERE
        (r.description IS NOT NULL AND toLower(r.description) CONTAINS "leak") OR
        (sc.type IS NOT NULL AND toLower(sc.type) CONTAINS "leak") OR
        (sc.path IS NOT NULL AND toLower(sc.path) CONTAINS "leak") OR
        (wo.description IS NOT NULL AND toLower(wo.description) CONTAINS "leak")
        RETURN a.id AS AssetID,
        a.name AS AssetName,
        r.friendly_key AS RequestKey,
        r.description AS RequestDescription,
        sc.type AS ServiceType,
        sc.path AS ServicePath,
        wo.description AS WorkOrderDescription
        ORDER BY r.friendly_key limit 10
      
  - input: "Which assets have recurring issues and what are the root causes?"
    output: |
        MATCH (a:Asset)<-[:CONTAINS]-(p:Position)<-[:TARGETS]-(r:Request)-[:ACTIVATES]->(sc:ServiceClassification)
        WHERE r.description IS NOT NULL AND sc.inputStream IS NOT NULL AND 
        (toLower(sc.inputStream) CONTAINS "reactive" OR toLower(sc.inputStream) CONTAINS "corrective")
        WITH a, toLower(r.description) AS NormalizedIssue, sc.inputStream AS RootCauseDetails
        WITH a, NormalizedIssue, RootCauseDetails, COUNT(*) AS OccurrenceCount
        WHERE OccurrenceCount > 1
        RETURN a.id AS AssetID,
        a.name AS AssetName,
        NormalizedIssue AS RecurringIssue,
        OccurrenceCount,
        RootCauseDetails AS RootCause
        ORDER BY OccurrenceCount DESC

  - input: "What issues an asset  faced in the last 6 months?"
    output: |
          MATCH (a:Asset {id: "23934c29-cbdb-4cab-9ade-b12d4e7ed4cf"})<-[:CONTAINS]-(p:Position)<-[:TARGETS]-(r:Request)-[:ACTIVATES]->(sc:ServiceClassification)
          WHERE date(substring(r.reportedDate, 0, 10)) >= date() - duration({months: 6})
          RETURN r.friendly_key AS RequestKey,
          r.description AS RequestDescription,
          a.id AS AssetID,
          a.name AS AssetName,
          sc.id AS ClassificationID,
          sc.type AS ServiceClassification,
          sc.path AS SCPath,
          r.reportedDate AS ReportedDate
          ORDER BY r.reportedDate DESC
        
  - input: "How many requests for a given asset in past 12 months?"
    output: |
          MATCH (r:Request)-[:TARGETS]->(p:Position)-[:CONTAINS]->(a:Asset)
          WHERE apoc.date.parse(r.reportedDate, 'ms', 'yyyy-MM-dd\'T\'HH:mm:ss') >= apoc.date.currentTimestamp() - 1000 * 60 * 60 * 24 * 365
          RETURN a.name AS AssetName, a.id AS AssetID, COUNT(r) AS RequestCount
          ORDER BY RequestCount DESC
          LIMIT 10

  - input: "give me number of technician visits for the last quarter?"
    output: |
          MATCH (a:Activity)-[:RESPONDS]->(w:WorkOrder)-[:RESPONDS]->(r:Request)-[:TARGETS]->(p:Position)-[:CONTAINS]->(asset:Asset)
          WHERE apoc.date.parse(a.startDate, 'ms', 'yyyy-MM-dd\'T\'HH:mm:ss') >= apoc.date.currentTimestamp() - 1000 * 60 * 60 * 24 * 90
          RETURN asset.id AS AssetID, asset.name AS AssetName, r.reportedDate AS VisitDate, r.description AS IssueCause
          ORDER BY r.reportedDate DESC